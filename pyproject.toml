[project]
name = "skybrush-log-analyzer"
version = "0.1.0"
description = "Command line application for ArduPilot log analysis using https://logs.skybrush.io."
readme = "README.md"
authors = [
    { name = "Peter Volf", email = "do.volfp@gmail.com" },
    { name = "Tamas Nepusz", email = "tamas@collmot.com" },
    { name = "Gabor Vasarhelyi", email = "vasarhelyi@collmot.com" },
]
requires-python = ">=3.11"
dependencies = [
    "httpx2>=2.9.1",
    "platformdirs>=4.11.0",
    "typer>=0.27.1",
]

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "poethepoet>=0.48.0",
    "ruff>=0.16.9",
    "zensical>=0.0.65",
]

[project.scripts]
skybrush-log-analyzer = "skybrush_log_analyzer.main:run"

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root=""

[tool.mypy]
strict = true
show_error_codes = true

[tool.ruff]
line-length = 108
exclude = [
    ".git",
    ".mypy_cache",
    ".pytest_cache",
    ".ruff_cache",
    ".venv",
    "dist",
    "docs",
]
lint.select = [
    "B", # flake8-bugbear
    "C", # flake8-comprehensions
    "E", # pycodestyle errors
    "F", # pyflakes
    "I", # isort
    "S", # flake8-bandit - we must ignore these rules in tests
    "W", # pycodestyle warnings
]

[tool.poe.tasks]
serve-docs = "zensical serve"
build-docs = "zensical build --clean"

format = "ruff format . --check"
format-fix = "ruff format ."

lint = "ruff check ."
lint-fix = "ruff check . --fix"

type = "mypy ."

check.sequence = ["format", "lint", "type"]
check.ignore_fail = "return_non_zero"
