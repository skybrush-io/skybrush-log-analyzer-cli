site_name: Skybrush Log Analyzer
repo_name: skybrush-io/skybrush-log-analyzer-cli
repo_url: https://github.com/skybrush-io/skybrush-log-analyzer-cli

theme:
  palette:
    # Palette toggle for automatic mode
    - media: "(prefers-color-scheme)"
      scheme: slate
      toggle:
        icon: lucide/sun-moon
        name: Switch to light mode
    # Palette toggle for light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: lucide/sun
        name: Switch to dark mode
    # Palette toggle for dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: lucide/moon
        name: Switch to system preference
  features:
    - navigation.instant
    - navigation.tracking
    - search.suggest
    - search.highlight
    - content.code.copy

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences

plugins:
  - mkdocstrings:
      handlers:
        python:
          paths: [.]

nav:
  - Skybrush Log Analyzer: index.md
  - API reference:
      - api_client.py: api/api_client.md
      - config.py: api/config.md
      - errors.py: api/errors.md
      - analysis.py: api/analysis.md
      - typing.py: api/typing.md
